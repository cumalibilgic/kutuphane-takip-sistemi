name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: JDK 25 kur
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Derle ve testleri calistir
        run: mvn --batch-mode test

      - name: Test raporu yukle (basarisizlikta da goster)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-raporu
          path: target/surefire-reports/