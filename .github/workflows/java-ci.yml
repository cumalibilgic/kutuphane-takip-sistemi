name: Java CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: JDK 21 kur
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: JUnit jar dosyasını indir
        run: |
          mkdir -p lib
          curl -L -o lib/junit-platform-console-standalone-1.9.1.jar \
            https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.9.1/junit-platform-console-standalone-1.9.1.jar

      - name: Ana uygulamayı derle
        run: javac -d out src/*.java

      - name: Testlerle birlikte derle
        run: javac -cp lib/junit-platform-console-standalone-1.9.1.jar -d out-test src/*.java test/*.java

      - name: Testleri çalıştır
        run: |
          java -jar lib/junit-platform-console-standalone-1.9.1.jar execute \
            -cp out-test --scan-classpath --fail-if-no-tests
